<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spoken English Poster</title>

    <style>

        body{
            background:#dff5ef;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            font-family:Arial, sans-serif;
        }

        .poster{
            width:340px;
            background:white;
            padding:20px;
            border-radius:12px;
            position:relative;
            box-shadow:0 5px 15px rgba(0,0,0,0.2);
        }

        /* TOP CIRCLE */
        .circle{
            position:absolute;
            top:20px;
            right:20px;
            width:85px;
            height:85px;
            background:#6c63ff;
            border-radius:50%;
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            text-align:center;
            font-size:14px;
            font-weight:bold;
            padding:10px;
        }

        /* MAIN TITLE */
        h1{
            margin:0;
            font-size:50px;
            line-height:50px;
            font-weight:900;
            color:#222;
        }

        .small-box{
            background:#34495e;
            color:white;
            display:inline-block;
            padding:5px 12px;
            margin-top:10px;
            font-size:13px;
            font-weight:bold;
        }

        .grammar{
            background:#f4d03f;
            display:inline-block;
            padding:8px 15px;
            font-size:34px;
            font-weight:bold;
            margin-top:10px;
        }

        .days{
            background:#b03a2e;
            color:white;
            display:inline-block;
            padding:10px 18px;
            border-radius:8px;
            font-size:42px;
            font-weight:bold;
            margin-top:12px;
        }

        .dates{
            margin-top:15px;
            font-size:20px;
            font-weight:bold;
            color:#34495e;
        }

        /* IMAGE ALIGNMENT */
        .image-box{
            position:absolute;
            right:15px;
            top:180px;
        }

        .image-box img{
            width:140px;
            height:230px;
            object-fit:cover;
            border-radius:15px;
        }

        /* CONTENT SECTION */
        .bottom-content{
            margin-top:25px;
            width:55%;
        }

        .bottom-content ul{
            padding-left:18px;
            line-height:28px;
            color:#333;
        }

        /* FEE BOX */
        .fee-box{
            position:absolute;
            right:15px;
            bottom:85px;
            background:#34495e;
            color:white;
            width:120px;
            text-align:center;
            padding:10px;
            border-radius:12px;
        }

        .fee-box h2{
            margin:0;
            color:#f4d03f;
            font-size:40px;
        }

        .certificate{
            position:absolute;
            right:10px;
            bottom:20px;
            font-size:14px;
            font-weight:bold;
            color:#34495e;
        }

    </style>
</head>

<body>

    <div class="poster">

        <!-- TOP RIGHT CIRCLE -->
        <div class="circle">
            Join Now!
        </div>

        <!-- TITLE -->
        <h1>SPOKEN<br>ENGLISH</h1>

        <div class="small-box">
            CLASSES WITH
        </div>

        <br>

        <div class="grammar">
            GRAMMAR
        </div>

        <br>

        <div class="days">
            10 DAYS
        </div>

        <!-- DATES -->
        <div class="dates">
            17-05-2026 <br>
            27-05-2026
        </div>

        <!-- YOUR IMAGE -->
        <div class="image-box">

            <img src="pfp.jpg.jpeg" alt="My Photo">

        </div>

        <!-- FEATURES -->
        <div class="bottom-content">

            <ul>
                <li>Vocabulary</li>
                <li>Communication</li>
                <li>Grammar</li>
                <li>Public Speaking</li>
                <li>Confidence</li>
            </ul>

        </div>

        <!-- FEES -->
        <div class="fee-box">
            FEES
            <h2>499/-</h2>
        </div>

        <!-- CERTIFICATE -->
        <div class="certificate">
            WITH CERTIFICATE
        </div>

    </div>

</body>
</html>
