<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Animation using Transformations</title>

    <style>

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f2f2f2;
            font-family: Arial, sans-serif;
        }

        /* ANIMATED BOX */
        .box {
            width: 150px;
            height: 150px;
            background-color: royalblue;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 22px;
            border-radius: 15px;

            /* Animation */
            animation: animateBox 4s infinite;
        }

        /* KEYFRAMES */
        @keyframes animateBox {

            0% {
                transform: translateX(0px) rotate(0deg) scale(1);
                background-color: royalblue;
            }

            25% {
                transform: translateX(100px) rotate(90deg) scale(1.2);
                background-color: crimson;
            }

            50% {
                transform: translateY(100px) rotate(180deg) scale(1);
                background-color: green;
            }

            75% {
                transform: translateX(-100px) rotate(270deg) scale(1.2);
                background-color: orange;
            }

            100% {
                transform: translateX(0px) rotate(360deg) scale(1);
                background-color: royalblue;
            }
        }

    </style>
</head>

<body>

    <div class="box">
        Animation
    </div>

</body>
</html>
