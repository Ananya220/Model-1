<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Basic Meta Tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="This is a sample webpage with meta tags.">
    <meta name="keywords" content="HTML, Meta Tags, Web Development">
    <meta name="author" content="Ananya Sharma">

    <!-- Open Graph Meta Tags (for social media sharing) -->
    <meta property="og:title" content="My Webpage">
    <meta property="og:description" content="A simple webpage using HTML meta tags.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://example.com">
    <meta property="og:image" content="https://example.com/image.jpg">

    <!-- Browser Theme Color -->
    <meta name="theme-color" content="#4F46E5">

    <title>Meta Tags Example</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            color: #4F46E5;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome!</h1>
        <p>This webpage includes useful HTML meta tags.</p>
    </div>

</body>
</html>
